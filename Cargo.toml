[package]
name = "netpulse"
version = "0.1.0"
edition = "2021"
description = "Real-time network monitoring & load test/fuzzing agent for embedded Linux"

[dependencies]
# TUI / Terminal
ratatui = "0.28"
crossterm = "0.28"

# Packet capture & parsing
pnet = "0.35"
etherparse = "0.16"

# Async & Concurrency
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
crossbeam-channel = "0.5"

# CLI Parser
clap = { version = "4.5", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
